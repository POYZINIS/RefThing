[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace", "timeout", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# .ref board files: AES-128-CTR (hardware AES; random access for zip).
aes = "0.8"
ctr = "0.9"
infer = "0.16"
zip = "=2.4.2" # EXACT pin — the zip crate churned majors 2.x -> 8.x in 2025
tempfile = "3"
futures = "0.3"
dashmap = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
fast_image_resize = "6.1" # default features; rayon feature stays OFF (own pool instead)
webp = "0.3" # libwebp FFI — lossy WebP encode; image's encoder is lossless-only
rayon = "1.12"
# Audio waveforms: pure-Rust decoding of every common format (WAV, AIFF,
# CAF, FLAC, MP3, Ogg Vorbis, AAC/M4A, ALAC, Matroska/WebM) — no ffmpeg.
symphonia = { version = "0.6.1", features = ["all"] }
# …and Opus (Ogg/WebM voice notes and music), which Symphonia demuxes but
# can't decode: pure Rust, conformant, no dependencies, no build script;
# `unsafe` only in its SIMD kernels. (`opus-decoder`, all-safe, was ~130×
# slower: 13 s for a minute of audio.)
rusty-opus = "1.0.2"
