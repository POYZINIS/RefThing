[package]
name = "refthing-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
refthing-core = { path = "../refthing-core" }
tokio.workspace = true
# `ws` feature: axum gates `extract::ws` (WebSocketUpgrade/Message) behind it;
# the /api/boards/{id}/ws endpoint cannot exist without it. `multipart` is for
# `extract::Multipart` used by the ingest route.
axum = { workspace = true, features = ["ws", "multipart"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
async-trait.workspace = true
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio-tungstenite = "0.26"
