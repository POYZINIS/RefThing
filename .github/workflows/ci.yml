name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # sqlx query! macros check against the committed offline cache
      # (backend/.sqlx). Regenerate after changing queries:
      #   SQLX_OFFLINE=false DATABASE_URL=sqlite:./data/dev.db cargo sqlx prepare --workspace
      SQLX_OFFLINE: "true"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all --manifest-path backend/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path backend/Cargo.toml --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (Biome)
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck -w frontend
      - name: Build
        run: npm run build -w frontend
