<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RefThing</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply the saved theme before first paint (ui/appearance.ts owns it
      // after that), so the workspace never flashes the other theme.
      (() => {
        const root = document.documentElement;
        try {
          const saved = JSON.parse(localStorage.getItem('refthing.appearance') || '{}');
          const mode = saved.theme || 'system';
          const dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.glass = saved.glass === false ? 'off' : 'on';
        } catch {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
