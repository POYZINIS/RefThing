[package]
name = "refthing-app"
version = "0.2.0"
description = "RefThing desktop app"
edition = "2024"
license = "MIT"

# Standalone crate at the repo root: NOT part of the backend workspace.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
refthing-server = { path = "../backend/crates/refthing-server" }
refthing-core = { path = "../backend/crates/refthing-core" }
tokio = { version = "1", features = ["sync"] }
# Updates from the GitHub releases (signed; see docs/releasing.md).
tauri-plugin-updater = "2"
# generate_context! reads plugin config (tauri.conf.json "plugins") through it.
serde_json = "1"
# .ref board files: native save/open dialogs, and one running app (a
# double-clicked file opens in the window already open, not a second server).
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
# Set by the no-MSVC link shim's machine-local cargo config (docs/prerequisites.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(refthing_link_shim)"] }
